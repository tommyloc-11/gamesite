<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000+ Games Hub</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
    font-size:30px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:20px;
}

.game{
    background:#1e293b;
    border-radius:10px;
    padding:10px;
    text-align:center;
    transition:0.3s;
}

.game:hover{
    transform:scale(1.05);
}

.game img{
    width:100%;
    border-radius:8px;
}

a{
    text-decoration:none;
    color:white;
}
</style>
</head>

<body>

<header>
🎮 1000+ Games Website
</header>

<div class="games">

<div class="game">
<a href="games/game1.html">
<img src="https://via.placeholder.com/200x120">
<h3>Game 1</h3>
</a>
</div>

<div class="game">
<a href="games/game2.html">
<img src="https://via.placeholder.com/200x120">
<h3>Game 2</h3>
</a>
</div>

<div class="game">
<a href="games/game3.html">
<img src="https://via.placeholder.com/200x120">
<h3>Game 3</h3>
</a>
</div>

</div>

</body>
</html>
