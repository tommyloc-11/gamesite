<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1000+ Games</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:#020617;
}

#search{
padding:8px;
border-radius:5px;
border:none;
}

.categories{
display:flex;
gap:10px;
padding:10px;
background:#020617;
overflow-x:auto;
}

.categories button{
background:#1e293b;
border:none;
color:white;
padding:8px 12px;
border-radius:20px;
cursor:pointer;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.game{
background:#1e293b;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.2s;
}

.game:hover{
transform:scale(1.05);
}

.game img{
width:100%;
height:120px;
object-fit:cover;
}

.game h3{
padding:10px;
font-size:14px;
}

#player{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
z-index:999;
}

#player iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:20px;
right:20px;
background:red;
border:none;
color:white;
padding:10px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h2>🎮 1000+ Games</h2>

<input id="search" placeholder="Zoek game...">

</header>

<div class="categories">

<button onclick="filterCategory('all')">All</button>
<button onclick="filterCategory('puzzle')">Puzzle</button>
<button onclick="filterCategory('arcade')">Arcade</button>
<button onclick="filterCategory('action')">Action</button>

</div>

<div id="games" class="games"></div>

<div id="player">

<button id="close" onclick="closeGame()">X</button>

<iframe id="gameFrame"></iframe>

</div>

<script>

const games = [

{
title:"2048",
category:"puzzle",
image:"https://upload.wikimedia.org/wikipedia/commons/1/18/2048_logo.svg",
url:"https://play2048.co/"
},

{
title:"Hextris",
category:"arcade",
image:"https://hextris.io/images/hextris-logo.png",
url:"https://hextris.io/"
},

{
title:"Tetris",
category:"puzzle",
image:"https://upload.wikimedia.org/wikipedia/commons/7/7c/Tetris_logo.png",
url:"https://tetris.com/play-tetris"
},

{
title:"Snake",
category:"arcade",
image:"https://upload.wikimedia.org/wikipedia/commons/5/55/Snake_game.jpg",
url:"https://playsnake.org/"
}

]

let current = games

function displayGames(list){

const container=document.getElementById("games")

container.innerHTML=""

list.forEach(game=>{

const div=document.createElement("div")

div.className="game"

div.innerHTML=`

<img src="${game.image}">
<h3>${game.title}</h3>

`

div.onclick=()=>playGame(game.url)

container.appendChild(div)

})

}

function playGame(url){

document.getElementById("player").style.display="block"

document.getElementById("gameFrame").src=url

}

function closeGame(){

document.getElementById("player").style.display="none"

document.getElementById("gameFrame").src=""

}

function filterCategory(cat){

if(cat==="all"){
current=games
}else{
current=games.filter(g=>g.category===cat)
}

displayGames(current)

}

document.getElementById("search").addEventListener("input",function(){

const value=this.value.toLowerCase()

displayGames(current.filter(g=>g.title.toLowerCase().includes(value)))

})

displayGames(games)

</script>

</body>
</html>
