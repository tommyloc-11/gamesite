<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000+ Games</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
padding:20px;
background:#020617;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:bold;
}

#search{
padding:10px;
width:250px;
border-radius:6px;
border:none;
}

.categories{
display:flex;
gap:10px;
padding:15px;
overflow:auto;
background:#020617;
}

.cat{
background:#1e293b;
padding:8px 15px;
border-radius:20px;
cursor:pointer;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.game{
background:#1e293b;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.2s;
}

.game:hover{
transform:scale(1.05);
}

.game img{
width:100%;
}

.game h3{
padding:10px;
font-size:16px;
}

#player{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
}

#player iframe{
width:100%;
height:100%;
border:none;
}

#close{
position:absolute;
top:20px;
right:20px;
background:red;
border:none;
color:white;
padding:10px 15px;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<header>

<div class="logo">🎮 1000+ Games</div>

<input id="search" placeholder="Zoek een game...">

</header>

<div class="categories">

<div class="cat" onclick="filterGames('all')">All</div>
<div class="cat" onclick="filterGames('action')">Action</div>
<div class="cat" onclick="filterGames('arcade')">Arcade</div>
<div class="cat" onclick="filterGames('racing')">Racing</div>
<div class="cat" onclick="filterGames('puzzle')">Puzzle</div>
<div class="cat" onclick="filterGames('shooting')">Shooting</div>

</div>

<div class="games" id="games"></div>

<div id="player">

<button id="close" onclick="closeGame()">X</button>

<iframe id="gameFrame"></iframe>

</div>

<script>

const games = [

{
title:"Subway Surfers",
category:"arcade",
img:"https://i.imgur.com/2DhmtJ4.jpeg",
url:"https://example.com"
},

{
title:"Drift Racing",
category:"racing",
img:"https://i.imgur.com/g1QXK4T.jpeg",
url:"https://example.com"
},

{
title:"Zombie Shooter",
category:"shooting",
img:"https://i.imgur.com/F3qJ1uM.jpeg",
url:"https://example.com"
},

{
title:"Puzzle Blocks",
category:"puzzle",
img:"https://i.imgur.com/VL0F3yx.jpeg",
url:"https://example.com"
}

]

const container = document.getElementById("games")

function loadGames(list){

container.innerHTML=""

list.forEach(game=>{

container.innerHTML+=`

<div class="game" onclick="playGame('${game.url}')">

<img src="${game.img}">
<h3>${game.title}</h3>

</div>

`

})

}

loadGames(games)

function playGame(url){

document.getElementById("player").style.display="flex"
document.getElementById("gameFrame").src=url

}

function closeGame(){

document.getElementById("player").style.display="none"
document.getElementById("gameFrame").src=""

}

function filterGames(cat){

if(cat==="all"){
loadGames(games)
return
}

loadGames(games.filter(g=>g.category===cat))

}

document.getElementById("search").addEventListener("input",function(){

const value=this.value.toLowerCase()

const filtered=games.filter(g=>g.title.toLowerCase().includes(value))

loadGames(filtered)

})

</script>

</body>
</html>
